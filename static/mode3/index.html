<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('pdf_tool_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode 3 - Charte Compliance</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/mode2/style.css">
</head>
<body>
    <div class="mode2-container">
        <header class="app-header mode2-header">
            <h1 id="header-title">Công cụ so sánh PDF</h1>
            <p class="mode2-desc" id="header-desc">Charte là cố định trong hệ thống. Bạn chỉ cần upload Produit Fini PDF để kiểm tra.</p>
            <div class="mode-switch-tabs">
                <a class="mode-tab" href="/">Mode 1</a>
                <a class="mode-tab" href="/mode2">Mode 2</a>
                <a class="mode-tab active" href="/mode3">Mode 3</a>
            </div>
            <div class="header-controls">
                <button class="theme-toggle" id="theme-toggle" title="Đổi sáng/tối">
                    <span class="theme-icon theme-sun">○</span>
                    <span class="theme-icon theme-moon">☾</span>
                </button>
                <div class="lang-switcher">
                    <button class="lang-btn" data-lang="vi">VN</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="fr">FR</button>
                </div>
            </div>
        </header>

        <section class="mode2-upload">
            <div class="mode2-upload-group" style="grid-column: 1 / -1;">
                <label id="label-produit">Produit Fini PDF</label>
                <input type="file" id="finalPdf" accept=".pdf" />
                <div class="mode2-preview-wrap"><iframe id="previewFinal" src="about:blank"></iframe></div>
            </div>
        </section>

        <section class="mode2-actions">
            <button id="btnCheck" class="mode2-btn" disabled>Chạy kiểm tra Mode 3</button>
        </section>

        <section class="mode2-status" id="status" hidden><span id="statusText"></span></section>

        <section class="mode2-result" id="result" hidden>
            <h2 id="results-title">Kết quả Mode 3</h2>
            <div id="charteInfo" class="mode2-summary"></div>
            <div id="hardSummary" class="mode2-summary"></div>
            <div id="softSummary" class="mode2-summary"></div>
            <div class="mode2-links">
                <a id="linkView" href="#" target="_blank" rel="noopener">Mở PDF kết quả</a>
                <a id="linkDownload" href="#" download>Tải PDF</a>
                <a id="linkReport" href="#" target="_blank" rel="noopener">Xem report JSON</a>
            </div>
            <div class="mode2-pdf-view">
                <h3 id="view-pdf">Xem PDF</h3>
                <iframe id="pdfViewer" src="about:blank"></iframe>
            </div>
        </section>

        <section class="mode2-error" id="error" hidden><p id="errorText"></p></section>
    </div>
    <script src="/static/i18n-shared.js"></script>
    <script src="/static/mode3/app.js"></script>
</body>
</html>
